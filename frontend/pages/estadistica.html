<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas de Encuestas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .card-chart {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: none;
        }
        .card-chart:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-weight: 600;
        }
        .chart-container {
            position: relative;
            height: 300px;
            padding: 15px;
        }
        .stat-card {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
        }
        .stat-label {
            opacity: 0.9;
            font-size: 0.9rem;
        }
        .question-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .question-item {
            border-left: 4px solid #2575fc;
            padding-left: 15px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 text-primary">
                <i class="bi bi-bar-chart-line me-2"></i> Estadísticas de Respuestas
            </h1>
            <div>
                <select id="selectEncuesta" class="form-select" style="width: 300px;">
                    <option value="">Seleccionar encuesta...</option>
                </select>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-value" id="totalRespuestas">0</div>
                    <div class="stat-label">Respuestas totales</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
                    <div class="stat-value" id="totalPreguntas">0</div>
                    <div class="stat-label">Preguntas en encuesta</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background: linear-gradient(135deg, #f46b45 0%, #eea849 100%);">
                    <div class="stat-value" id="participantes">0</div>
                    <div class="stat-label">Participantes únicos</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background: linear-gradient(135deg, #8e2de2 0%, #4a00e0 100%);">
                    <div class="stat-value" id="completadas">0%</div>
                    <div class="stat-label">Tasa de completitud</div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="card card-chart mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-pie-chart me-2"></i> Distribución de Respuestas</h5>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-secondary active chart-type" data-type="bar">
                                <i class="bi bi-bar-chart"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-secondary chart-type" data-type="pie">
                                <i class="bi bi-pie-chart"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="graficoPrincipal"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card card-chart mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-list-check me-2"></i> Preguntas</h5>
                    </div>
                    <div class="card-body question-list" id="listaPreguntas">
                        <!-- Preguntas se cargarán aquí -->
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card card-chart mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-check2-circle me-2"></i> Respuestas Sí/No</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="graficoSiNo"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card card-chart">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-people me-2"></i> Participación por Día</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="graficoParticipacion"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js plugins -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="/js/estadisticas.js"></script>
   
</body>
</html>
