<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas de Encuesta</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>

<body class="bg-light" style="background: linear-gradient(135deg, #f2f6fc, #e5ecfb);">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 rounded-4">
                    
                    <div class="card-header bg-primary text-white rounded-top-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <h2 class="h5 mb-0 fw-bold">
                                <i class="bi bi-list-task me-2"></i>Preguntas de la Encuesta
                            </h2>
                            <a href="/empleado" class="btn btn-sm btn-light rounded-pill">
                                <i class="bi bi-arrow-left-circle me-1"></i> Volver
                            </a>
                        </div>
                    </div>

                    <div class="card-body p-4">
                        <!-- Info de la encuesta -->
                        <div class="mb-4 p-4 bg-white rounded-4 border shadow-sm">
                            <h3 id="nombreEncuesta" class="h5 mb-2 fw-semibold text-primary">
                                <i class="bi bi-journal-text me-2"></i>Cargando...
                            </h3>
                            <p id="descripcionEncuesta" class="text-muted mb-3"></p>
                            <div class="d-flex justify-content-between small text-muted">
                                <span>
                                    <i class="bi bi-calendar-event me-1"></i><span id="fechaCreacion"></span>
                                </span>
                                <span>
                                    <i class="bi bi-calendar-check me-1"></i><span id="fechaLimite"></span>
                                </span>
                            </div>
                        </div>

                        <!-- Lista de preguntas -->
                        <div id="listaPreguntas">
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                                    <span class="visually-hidden">Cargando...</span>
                                </div>
                                <p class="mt-3 text-muted">Cargando preguntas...</p>
                            </div>
                        </div>

                        <!-- Botón de enviar -->
                        <div class="d-grid mt-4">
                            <button id="btnEnviar" class="btn btn-success btn-lg rounded-pill" disabled>
                                <i class="bi bi-send-check-fill me-2"></i>Enviar Respuestas
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu script -->
    <script src="/js/preguntas.js"></script>
</body>

</html>
